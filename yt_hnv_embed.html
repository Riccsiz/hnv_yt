<!DOCTYPE html>
<html>
<head>
    <style>
        /* Make the video fill the screen */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="youtubePlayer" 
        src="https://www.youtube.com/watch?v=cFDKslME0L8?autoplay=1&enablejsapi=1&rel=0&controls=0&showinfo=0&vq=hd1080"
        allowfullscreen>
    </iframe>

    <script>
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtubePlayer', {
                events: {
                    'onReady': function(event) {
                        event.target.setPlaybackQuality('hd1080'); // Force HD
                        event.target.playVideo();
                    }
                }
            });
        }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
